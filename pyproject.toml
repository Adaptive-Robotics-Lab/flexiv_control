[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexiv-control"
# Single-sourced from flexiv_control.__version__ (see [tool.setuptools.dynamic])
# so the version is defined in exactly one place.
dynamic = ["version"]
description = "A unified, real-time execution & safety layer for Flexiv Rizon arms: one action contract for teleop, MPC, RL, and real2sim2real."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Zihao Lu" }]
keywords = [
    "robotics", "manipulation", "flexiv", "rizon", "controller",
    "reinforcement-learning", "mpc", "teleoperation", "real2sim2real", "lerobot",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# The CORE depends on numpy only. Everything else is an optional extra so the
# client stays trivially installable into any project (RL trainer, MPC, notebook).
dependencies = ["numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/ZihaoLu001/flexiv_control"
Repository = "https://github.com/ZihaoLu001/flexiv_control"
Changelog = "https://github.com/ZihaoLu001/flexiv_control/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Real Flexiv hardware. Pinned to RDK v1.x: the backend targets v1.x (robot
# software v3.x); v0.x and v2.x have incompatible APIs -- see docs/versions.md.
flexiv = ["flexivrdk>=1.5,<2"]
# Reinforcement learning env.
rl = ["gymnasium>=0.29"]
# LeRobot community integration.
lerobot = ["lerobot"]
# SpaceMouse teleoperation / RL intervention.
teleop = ["pyspacemouse"]
# Nicer YAML parsing (a tiny fallback parser is built in, so this is optional).
yaml = ["pyyaml"]
# MuJoCo simulation backend.
mujoco = ["mujoco>=3.0"]
# Live browser visualization: robot mirror + intended-motion preview
# (viser web viewer + yourdfpy URDF kinematics; standalone xacro generates the
# Rizon arm+gripper URDF from the vendor's flexiv_description sources).
viz = ["viser>=1.0,<2", "yourdfpy>=0.0.53", "xacro>=2.0"]
# Dev / CI.
dev = ["pytest>=7", "pytest-timeout", "ruff"]

[project.scripts]
flexiv-control = "flexiv_control.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "flexiv_control.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The YAML config templates live inside the package (src/flexiv_control/configs/)
# so they ship in the wheel; config.py resolves profile names against that dir.
# py.typed marks the package as typed (PEP 561) so downstream type-checkers read
# the inline annotations.
[tool.setuptools.package-data]
flexiv_control = ["configs/**/*.yaml", "sim/*.xml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
# Pin the repository's historical Ruff default instead of inheriting changes
# to the tool's default rule set across releases.
select = ["E4", "E7", "E9", "F"]
