# ActAhead lab Rizon4s -- derived from the real cell
# (ActAhead config/robot/lab_flexiv_gn01.relative.yaml + config/workspace.yaml).
# Switch `backend` to flexiv_rdk for the real arm or mujoco for sim2real.
robot_id: rizon4s_actahead_lab
backend: fake
robot_sn: "Rizon4s-062626"
# GN01 gripper: the device name Flexiv Elements -> Settings -> Device reports for it.
gripper_name: "Flexiv-GN01"
n_joints: 7
# Flexiv RT_JOINT_TORQUE consumes a smooth command every 1 ms.
control_hz: 1000.0
allow_joint_torque: true
default_safety_profile: actahead_lab
# Restore/initial pose used in the lab. Source of truth: ActAhead
# config/lab_home_posture.json (read-only RDK probe of the real arm); the
# previous transcription had the j7 sign flipped (-0.003 vs the probed +0.0036).
q_home: [-0.00109, -0.700414, -0.002085, 1.572872, 0.004996, 0.688793, 0.003576]
# The canonical posture includes the gripper: OPEN at 0.085 m (the recorded
# "AND GRIPPER OPEN" half that a joints-only q_home could not express).
gripper_home_width: 0.085

# --- MuJoCo sim (real2sim2real) -------------------------------------------
# Build a persistent arm+GN01 model once with the bundled builder:
#   python -m flexiv_control.sim.build_rizon_gn01 \
#     --arm <menagerie>/flexiv_rizon4/scene.xml \
#     --grav-meshdir <flexiv_description>/meshes/Grav \
#     --out rizon4_gn01.xml
# then set model_path to that file's absolute path. (An arm-only menagerie
# scene.xml also works, but then there is no gripper and the TCP is the flange.)
model_path: ""
control_dt: 0.02
# Gripper TCP + actuator of the built GN01 model. The GN01 4-bar actuator ctrl is
# 9.404 * width_m - 0.155 (so move_gripper width in [0, 0.10] m maps correctly).
mujoco_tcp_site: "tcp"
mujoco_gripper_actuator: "gn01_width"
mujoco_gripper_width_scale: 9.404
mujoco_gripper_width_offset: -0.155
